name: Build all
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  citizen-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - name: دمج إعدادات الزبون داخل تطبيق المواطن
        env: { GS: "${{ secrets.CITIZEN_GOOGLE_SERVICES }}" }
        run: |
          if [ -n "$GS" ]; then
            mkdir -p citizen-app/app/src/main/assets
            echo "$GS" | base64 -d > citizen-app/app/src/main/assets/fb_config.json
          else
            echo "::warning::لا يوجد سر CITIZEN_GOOGLE_SERVICES، سيطلب التطبيق ملف الربط عند أول فتح"
          fi
      - run: gradle -p citizen-app assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: citizen-app-apk, path: "citizen-app/app/build/outputs/apk/debug/*.apk" }

  staff-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - run: gradle -p staff-app assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: staff-app-apk, path: "staff-app/app/build/outputs/apk/debug/*.apk" }

  desktop-exe:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
        working-directory: desktop-app
      - run: npm run dist
        working-directory: desktop-app
      - uses: actions/upload-artifact@v4
        with: { name: desktop-installer, path: "desktop-app/dist/*.exe" }
