name: Build all
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  citizen-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - name: google-services.json
        env: { GS: "${{ secrets.CITIZEN_GOOGLE_SERVICES }}" }
        run: |
          if [ -n "$GS" ]; then echo "$GS" | base64 -d > citizen-app/app/google-services.json; fi
          test -f citizen-app/app/google-services.json || { echo "::error::ضع ملف google-services.json داخل citizen-app/app/"; exit 1; }
      - run: gradle -p citizen-app assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: citizen-app-apk, path: "citizen-app/app/build/outputs/apk/debug/*.apk" }

  staff-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - name: google-services.json
        env: { GS: "${{ secrets.STAFF_GOOGLE_SERVICES }}" }
        run: |
          if [ -n "$GS" ]; then echo "$GS" | base64 -d > staff-app/app/google-services.json; fi
          test -f staff-app/app/google-services.json || { echo "::error::ضع ملف google-services.json داخل staff-app/app/"; exit 1; }
      - run: gradle -p staff-app assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: staff-app-apk, path: "staff-app/app/build/outputs/apk/debug/*.apk" }

  desktop-exe:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
        working-directory: desktop-app
      - run: npm run dist
        working-directory: desktop-app
      - uses: actions/upload-artifact@v4
        with: { name: desktop-installer, path: "desktop-app/dist/*.exe" }
