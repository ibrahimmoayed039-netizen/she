<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'">
  <title>مركز الشكاوى</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <aside class="side">
      <div class="brand">
        <div class="logo">📣</div>
        <div class="brand-t"><b>مركز الشكاوى</b><span>إدارة وتوجيه ومتابعة</span></div>
      </div>
      <nav>
        <div class="nav-grp">الشكاوى</div>
        <button data-t="new" class="on"><span class="ico">📥</span><span class="lbl">بانتظار التحليل</span><span class="badge hide" id="b-new"></span></button>
        <button data-t="routed"><span class="ico">📌</span><span class="lbl">تم التوجيه</span><span class="badge soft hide" id="b-routed"></span></button>
        <button data-t="manual"><span class="ico">✍️</span><span class="lbl">إدخال يدوي</span></button>
        <button data-t="classify"><span class="ico">🗂️</span><span class="lbl">تصنيف الشكاوى</span></button>
        <button data-t="done"><span class="ico">✅</span><span class="lbl">الأعمال المنجزة</span></button>
        <div class="nav-grp">المتابعة</div>
        <button data-t="perf"><span class="ico">📊</span><span class="lbl">أداء الكوادر</span></button>
        <button data-t="crews"><span class="ico">🚧</span><span class="lbl">حالة الكوادر الآن</span></button>
        <button data-t="setup"><span class="ico">🧭</span><span class="lbl">توزيع الكوادر والقواطع</span></button>
        <button data-t="report"><span class="ico">🏢</span><span class="lbl">تقارير الفروع</span></button>
        <div class="nav-grp">النظام</div>
        <button data-t="settings"><span class="ico">⚙️</span><span class="lbl">الإعدادات</span></button>
      </nav>
      <div class="side-foot">نظام الشكاوى المتكامل</div>
    </aside>
    <section class="content">
      <header class="topbar">
        <h1 id="title">مركز الشكاوى</h1>
        <div id="kpis" class="kpis"></div>
        <div id="log"></div>
      </header>
      <main id="view"></main>
    </section>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
